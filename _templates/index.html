<section class="hero">
  <h1>{{site_title}}</h1>
  <p class="subtitle">{{subtitle}}</p>
  <p class="site-description">{{description}}</p>
</section>
<section class="recent-posts">
  <h2>Blog</h2>
  <nav aria-label="Blog categories">
    <ul class="category-list">
      {{categories}}
    </ul>
  </nav>
  <h3>Recent Posts</h3>
  <div class="post-list">
    {{recent_posts}}
  </div>
  <p><a href="/posts/index.html">View all posts</a></p>
</section>
